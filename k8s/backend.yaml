apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: hybrid-rag-docs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: localhost/hybrid-rag-docs-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: hybrid-rag-docs-config
            - secretRef:
                name: hybrid-rag-docs-secrets
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            # Higher memory ceiling than a typical API pod — torch +
            # sentence-transformers' loaded model footprint is real.
            requests: { cpu: 250m, memory: 768Mi }
            limits: { cpu: 1, memory: 1536Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: hybrid-rag-docs
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
