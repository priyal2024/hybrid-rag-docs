apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: hybrid-rag-docs
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: localhost/hybrid-rag-docs-backend:local
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: hybrid-rag-docs-secrets
