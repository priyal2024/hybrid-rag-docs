apiVersion: v1
kind: ConfigMap
metadata:
  name: hybrid-rag-docs-config
  namespace: hybrid-rag-docs
data:
  # DATABASE_URL/TEST_DATABASE_URL live in the Secret, not here — a
  # connection string carries the DB password, so it doesn't belong in a
  # plaintext ConfigMap even though everything else here is fine to.
  ENVIRONMENT: "production"
  REDIS_URL: "redis://redis:6379/0"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  LLM_BASE_URL: "https://api.groq.com/openai/v1"
  LLM_MODEL: "llama-3.1-8b-instant"
  CORS_ALLOW_ORIGINS_RAW: "http://localhost:3000"
  NEXT_PUBLIC_API_URL: "http://localhost:8000"
